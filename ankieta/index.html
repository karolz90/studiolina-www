<style>
/* Układ: jedna kolumna jak arkusz rysunku, postęp jako łańcuch wymiarowy, skale jak podziałka na rysunku */
:root {
  --paper: #F5F2EC;
  --pigeon: #CAD8DE;
  --ink: #1C1C1A;
  --teal: #2C4A52;
  --orange: #FF5C00;

  --bg: #F5F2EC;
  --fg: #1C1C1A;
  --muted: #5B6264;
  --rule: rgba(28, 28, 26, 0.14);
  --line: rgba(28, 28, 26, 0.32);
  --strong: rgba(28, 28, 26, 0.7);
  --chip: #FBFAF7;
  --tint: rgba(44, 74, 82, 0.07);
  --band: #CAD8DE;
  --band-fg: #1C1C1A;
  --band-muted: #3C4B50;
  --sel: #2C4A52;
  --sel-fg: #F5F2EC;
  --accent: #FF5C00;
  --accent-fg: #1C1C1A;

  --font-ui: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Overpass Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --fs-mono: 12px;
  --fs-s: 14px;
  --fs-m: 16px;
  --fs-q: 18px;
  --fs-lead: clamp(16px, 0.5vw + 14px, 19px);
  --fs-title: clamp(32px, 3.4vw + 18px, 52px);
  --fs-hero: clamp(38px, 5vw + 18px, 72px);

  --col: 760px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1C1A;
    --fg: #F5F2EC;
    --muted: #A5ADAF;
    --rule: rgba(245, 242, 236, 0.12);
    --line: rgba(245, 242, 236, 0.28);
    --strong: rgba(245, 242, 236, 0.7);
    --chip: #232321;
    --tint: rgba(202, 216, 222, 0.06);
    --band: #22353B;
    --band-fg: #F5F2EC;
    --band-muted: #B7C6CC;
    --sel: #CAD8DE;
    --sel-fg: #1C1C1A;
    --accent: #FF5C00;
    --accent-fg: #1C1C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1C1A;
  --fg: #F5F2EC;
  --muted: #A5ADAF;
  --rule: rgba(245, 242, 236, 0.12);
  --line: rgba(245, 242, 236, 0.28);
  --strong: rgba(245, 242, 236, 0.7);
  --chip: #232321;
  --tint: rgba(202, 216, 222, 0.06);
  --band: #22353B;
  --band-fg: #F5F2EC;
  --band-muted: #B7C6CC;
  --sel: #CAD8DE;
  --sel-fg: #1C1C1A;
  --accent: #FF5C00;
  --accent-fg: #1C1C1A;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: var(--fs-m);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  width: 100%;
  max-width: calc(var(--col) + 64px);
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 700px) {
  .wrap {
    padding-left: max(32px, env(safe-area-inset-left, 0px));
    padding-right: max(32px, env(safe-area-inset-right, 0px));
  }
}

.eyebrow, .mono {
  font-family: var(--font-mono);
  font-size: var(--fs-mono);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* nagłówek */
.top__in {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding-block: 20px 14px;
}
.logo {
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -0.035em;
  line-height: 1;
}
.top__meta { color: var(--muted); text-align: right; }

/* postęp: łańcuch wymiarowy */
.progress {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
}
.progress__in { padding-block: 6px 10px; display: grid; gap: 4px; }
.chain {
  display: flex;
  height: 26px;
  position: relative;
}
.chain::after {
  content: "";
  position: absolute;
  right: -5px;
  top: 50%;
  width: 11px;
  height: 1.5px;
  background: var(--fg);
  transform: rotate(-45deg);
}
.chain::before {
  content: "";
  position: absolute;
  right: 0;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: var(--line);
}
.chain__seg {
  flex-basis: 0;
  min-width: 10px;
  position: relative;
  border: 0;
  padding: 0;
  margin: 0;
  background:
    linear-gradient(var(--line), var(--line)) left center / 1px 14px no-repeat;
  cursor: pointer;
}
.chain__seg::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  transform: translateY(-50%);
  background: var(--strong);
  transition: height 0.3s var(--ease), background-color 0.3s var(--ease);
}
.chain__seg::after {
  content: "";
  position: absolute;
  left: -5px;
  top: 50%;
  width: 11px;
  height: 1.5px;
  background: var(--fg);
  transform: rotate(-45deg);
}
.chain__seg.is-done::before { height: 3px; background: var(--sel); }
.chain__seg.is-current::before { height: 5px; background: var(--accent); }
.chain__seg:hover::before { background: var(--fg); }
.chain__seg:focus-visible { outline-offset: 0; }
.progress__label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
}
.progress__label b { color: var(--fg); font-weight: 500; }

/* przyciski */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 48px;
  padding: 12px 22px;
  border-radius: 2px;
  font-weight: 700;
  font-size: 15px;
  line-height: 1.2;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s var(--ease), background-color 0.2s var(--ease), border-color 0.2s var(--ease);
}
.btn--primary { background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent); }
.btn--primary:hover { transform: translateY(-1px); }
.btn--ghost { background: transparent; color: inherit; border: 1px solid var(--line); }
.btn--ghost:hover { border-color: var(--strong); }
.linkbtn {
  background: none;
  border: 0;
  padding: 0;
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  font-weight: 600;
}

/* intro */
.band { background: var(--band); color: var(--band-fg); }
.band__in { padding-block: 48px 52px; display: grid; gap: 22px; }
.band .eyebrow { color: var(--band-muted); }
.intro__title {
  font-size: var(--fs-hero);
  font-weight: 800;
  line-height: 0.98;
  letter-spacing: -0.04em;
  text-wrap: balance;
  max-width: 13ch;
}
.intro__lead { font-size: var(--fs-lead); max-width: 56ch; line-height: 1.55; }
.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  color: var(--band-muted);
}
.facts li { display: flex; align-items: center; gap: 8px; }
.facts li::before { content: ""; width: 6px; height: 6px; background: currentColor; }
.intro__cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.intro__sign { color: var(--band-muted); font-size: var(--fs-s); }

.toc { padding-block: 36px 8px; display: grid; }
.toc__head { display: flex; justify-content: space-between; color: var(--muted); padding-bottom: 10px; }
.toc__row {
  display: grid;
  grid-template-columns: 3.2em 1fr auto;
  align-items: baseline;
  gap: 12px;
  width: 100%;
  padding: 14px 0;
  border: 0;
  border-top: 1px solid var(--rule);
  background: none;
  text-align: left;
  cursor: pointer;
}
.toc__row:last-child { border-bottom: 1px solid var(--rule); }
.toc__num { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--muted); }
.toc__t { font-weight: 600; font-size: 17px; min-width: 0; }
.toc__n { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.toc__row.is-done .toc__n::before { content: ""; width: 8px; height: 8px; background: var(--sel); }
.toc__row:hover .toc__t { text-decoration: underline; text-underline-offset: 4px; }

/* część ankiety */
.sec { padding-block: 40px 24px; }
.sec__head { display: grid; gap: 12px; padding-bottom: 18px; }
.sec__head .eyebrow { color: var(--muted); }
.sec__title {
  font-size: var(--fs-title);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.sec__title:focus { outline: none; }
.sec__lead { font-size: var(--fs-lead); color: var(--muted); max-width: 54ch; }

.q {
  display: grid;
  grid-template-columns: 2.8em minmax(0, 1fr);
  column-gap: 8px;
  row-gap: 10px;
  padding-block: 24px;
  border-top: 1px solid var(--rule);
}
.q > * { grid-column: 2; min-width: 0; }
.q > .q__num { grid-column: 1; grid-row: 1; padding-top: 4px; color: var(--muted); }
.q__label { font-size: var(--fs-q); font-weight: 700; line-height: 1.35; letter-spacing: -0.01em; text-wrap: balance; }
.q__meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); margin-top: -4px; }
.q__hint { font-size: var(--fs-s); color: var(--muted); max-width: 60ch; }
.q__body { padding-top: 4px; }

.q--sub {
  border-top: 0;
  padding-top: 0;
  margin-top: -6px;
}
.q--sub {
  background: linear-gradient(var(--line), var(--line)) no-repeat;
  background-size: 1px 100%;
  background-position: calc(2.8em + 8px) 0;
}
.q--sub > * { padding-left: 16px; }
.q--sub > .q__label { padding-top: 2px; font-size: 16px; }
.q--sub > .q__body { padding-bottom: 4px; }

.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--chip);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.25;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease);
}
.opt:hover { border-color: var(--strong); }
.opt__mark {
  flex: none;
  width: 14px;
  height: 14px;
  border: 1.5px solid currentColor;
  opacity: 0.75;
}
.opt--single .opt__mark { border-radius: 50%; }
.opt[aria-pressed="true"] {
  background: var(--sel);
  border-color: var(--sel);
  color: var(--sel-fg);
}
.opt[aria-pressed="true"] .opt__mark {
  opacity: 1;
  background: currentColor;
  box-shadow: inset 0 0 0 2.5px var(--sel);
}
.opt__bed {
  flex: none;
  height: 22px;
  border: 1.5px solid currentColor;
  border-radius: 1px;
  position: relative;
}
.opt__bed::before {
  content: "";
  position: absolute;
  left: 2px;
  right: 2px;
  top: 2px;
  height: 4px;
  border: 1px solid currentColor;
  opacity: 0.6;
}

.field {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  padding: 10px 0;
  font-size: 16px;
  font-weight: 500;
  border-radius: 0;
}
.field::placeholder { color: var(--muted); opacity: 0.7; }
.field:focus { outline: none; border-bottom-color: var(--accent); }
.field--other { margin-top: 10px; }
.unit { display: flex; align-items: baseline; gap: 10px; max-width: 220px; }
.unit span { font-weight: 600; }
textarea.field {
  min-height: 96px;
  resize: vertical;
  border: 1px solid var(--line);
  padding: 12px 14px;
  line-height: 1.5;
  border-radius: 2px;
}
textarea.field:focus { border-color: var(--accent); }

.step { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 2px; }
.step button {
  width: 48px;
  min-height: 46px;
  border: 0;
  background: var(--chip);
  font-size: 22px;
  font-weight: 500;
  cursor: pointer;
}
.step output {
  min-width: 56px;
  display: grid;
  place-items: center;
  border-inline: 1px solid var(--line);
  font-weight: 700;
  font-size: 18px;
  font-variant-numeric: tabular-nums;
}
.step output.is-empty { color: var(--muted); font-weight: 500; }

/* skala jak podziałka na rysunku */
.scale {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
  max-width: 560px;
  font-size: var(--fs-s);
  color: var(--muted);
}
.scale__r { text-align: right; }
.scale__track {
  grid-column: 1 / -1;
  display: flex;
  border: 1px solid var(--strong);
}
.scale__b {
  flex: 1;
  height: 40px;
  border: 0;
  border-left: 1px solid var(--strong);
  background: transparent;
  cursor: pointer;
  position: relative;
  transition: background-color 0.18s var(--ease);
}
.scale__b:first-child { border-left: 0; }
.scale__b:nth-child(even) { background: var(--tint); }
.scale__b:hover { background: var(--rule); }
.scale__b[aria-pressed="true"] { background: var(--sel); }
.scale__ticks {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  margin-top: -4px;
}
.scale__ticks span { flex: 1; text-align: center; }
.scale__ticks span.is-on { color: var(--fg); font-weight: 500; }


/* wycinki wnętrz: kwadratowe kadry, numer jak na planszy */
.pics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .pics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
.pic {
  position: relative;
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 0;
  border-radius: 2px;
  overflow: hidden;
  background: var(--rule);
  cursor: pointer;
}
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s var(--ease); }
.pic:hover img { transform: scale(1.04); }
.pic::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 4px solid transparent;
  pointer-events: none;
  transition: border-color 0.18s var(--ease);
}
.pic[aria-pressed="true"]::after { border-color: var(--sel); }
.pic__n {
  position: absolute;
  left: 0;
  top: 0;
  padding: 3px 7px;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  line-height: 1.4;
}
.pic__ok {
  position: absolute;
  right: 8px;
  top: 8px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  background: var(--sel);
  color: var(--sel-fg);
  font-weight: 800;
  font-size: 15px;
  line-height: 1;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
}
.pic[aria-pressed="true"] .pic__ok { opacity: 1; transform: none; }
.pic[aria-pressed="true"] .pic__n { background: var(--sel); color: var(--sel-fg); }

/* nawigacja */
.pager {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px;
  padding-block: 28px 56px;
  border-top: 1px solid var(--rule);
}
.pager .btn--primary { margin-left: auto; }
@media (max-width: 480px) {
  .pager .btn { flex: 1 1 100%; }
  .pager .btn--primary { order: -1; }
}

/* podsumowanie */
.send { gap: 18px; }
.send h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.send p { max-width: 60ch; }
.send__btns { display: flex; flex-wrap: wrap; gap: 10px; }
.status { font-weight: 600; min-height: 1.5em; }
.send__info { display: grid; gap: 6px; font-size: var(--fs-s); color: var(--band-muted); }
.send__info strong { color: var(--band-fg); font-weight: 700; user-select: all; }
.send__info .send__rodo { font-size: 12px; line-height: 1.5; padding-top: 6px; }
.outbox summary { cursor: pointer; font-weight: 600; font-size: var(--fs-s); }
.outbox textarea {
  margin-top: 10px;
  width: 100%;
  min-height: 220px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  padding: 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  border-radius: 2px;
}

.rev { border-top: 1px solid var(--rule); padding-block: 8px 18px; }
.rev__head {
  display: grid;
  grid-template-columns: 3.2em 1fr auto;
  align-items: baseline;
  gap: 12px;
  width: 100%;
  padding: 14px 0 10px;
  background: none;
  border: 0;
  text-align: left;
  cursor: pointer;
}
.rev__t { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.rev__num, .rev__edit { font-family: var(--font-mono); font-size: var(--fs-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.rev__head:hover .rev__edit { color: var(--fg); text-decoration: underline; }
.rev__list { display: grid; gap: 8px; padding-left: calc(3.2em + 12px); }
.rev__row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 16px; }
.rev__row dt { color: var(--muted); font-size: var(--fs-s); padding-top: 1px; }
.rev__row dd { font-weight: 600; overflow-wrap: anywhere; }
.rev__empty { padding-left: calc(3.2em + 12px); color: var(--muted); font-size: var(--fs-s); }
@media (max-width: 560px) {
  .rev__list, .rev__empty { padding-left: 0; }
  .rev__row { grid-template-columns: 1fr; gap: 0; }
}
.reset { padding-block: 24px 56px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: var(--muted); font-size: var(--fs-s); }

.foot { border-top: 1px solid var(--rule); }
.foot__in { font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding-block: 20px 28px; color: var(--muted); }
.foot__in a { color: inherit; }

.reveal { animation: rise 0.5s var(--ease) both; }
@keyframes rise { from { opacity: 0.001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .reveal { animation: none; }
  * { transition: none !important; }
}

  /* pomocnicze */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function arr(v) { return Array.isArray(v) ? v : (v == null || v === "" ? [] : [v]); }
  function has(id) {
    var v = A[id];
    if (v == null) return false;
    if (typeof v === "string") return v.trim() !== "";
    if (Array.isArray(v)) return v.length > 0;
    return true;
  }
  function plural(n, one, few, many) {
    if (n === 1) return one;
    var d = n % 10, h = n % 100;
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return few;
    return many;
  }
  function visible(q) {
    var w = q.when;
    if (!w) return true;
    var parent = QM[w.q];
    if (parent && !visible(parent)) return false;
    if (!has(w.q)) return false;
    var v = arr(A[w.q]);
    if (w.has) return v.some(function (x) { return w.has.indexOf(x) > -1; });
    if (w.not) return v.some(function (x) { return w.not.indexOf(x) < 0; });
    return true;
  }
  function otherOf(q) { return q.otherLabel || "inne"; }
  function optsOf(q) { return q.other ? q.o.concat([otherOf(q)]) : q.o; }
  function answered(s) {

  }

  /* format odpowiedzi */
  function scaleWord(q, n) {
    return ["zdecydowanie " + q.ls, "raczej " + q.ls, "pośrodku", "raczej " + q.rs, "zdecydowanie " + q.rs][n - 1];
  }
  function fmt(q) {
    var v = A[q.id];
    var oth = (A[q.id + "__o"] || "").trim();
    var ol = otherOf(q);
    if (q.type === "single") return v === ol && oth ? ol + ": " + oth : v;
    if (q.type === "multi") {
      return arr(v).map(function (x) { return x === ol && oth ? ol + ": " + oth : x; }).join(", ");
    }
    if (q.type === "scale") return scaleWord(q, v);
    if (q.type === "pics") return "nr " + arr(v).join(", ");
    if (q.type === "num") return String(v).trim() + " " + q.unit;
    if (q.type === "step") return String(v);
    return String(v).trim();
  }
  function items(s) {
    return s.q.filter(function (q) { return visible(q) && has(q.id); })
      .map(function (q) { return [q.short || q.label, fmt(q)]; });

  }

  function sectionHTML(i) {
    var s = S[i];
    var prev = i === 0 ? '<button type="button" class="btn btn--ghost" data-go="intro">&larr; start</button>' :
      '<button type="button" class="btn btn--ghost" data-go="' + (i - 1) + '">&larr; wstecz</button>';
    var next = i < S.length - 1 ?
      '<button type="button" class="btn btn--primary" data-go="' + (i + 1) + '">dalej: ' + esc(S[i + 1].t) + " &rarr;</button>" :
      '<button type="button" class="btn btn--primary" data-go="summary">podsumowanie &rarr;</button>';
    return '<div class="wrap"><section class="sec reveal" aria-labelledby="view-title">' +
      '<header class="sec__head"><p class="eyebrow">część ' + pad(i + 1) + " z " + S.length + "</p>" +
      '<h1 class="sec__title" id="view-title" tabindex="-1">' + esc(s.t) + "</h1>" +
      '<p class="sec__lead">' + esc(s.lead) + "</p></header>" +
      '<div class="qs">' + s.q.map(qHTML).join("") + "</div>" +
      '<nav class="pager" aria-label="Nawigacja">' + prev + next + "</nav></section></div>";
  }

  function links() {
    var full = buildText();
    var name = (A.name || "").trim();
    var subject = "Ankieta przed projektem" + (name ? ", " + name : "");
    var hello = "Dzień dobry, przesyłam ankietę przed projektem.";
    var body = hello + "\n\n" + full;
    var shortBody = hello + "\n\n(tutaj wklejam skopiowane odpowiedzi)\n";
    var e = encodeURIComponent;
    var wa = "https://wa.me/" + WA + "?text=" + e(body);
    if (wa.length > 7000) wa = "https://wa.me/" + WA + "?text=" + e(shortBody);
    var gm = "https://mail.google.com/mail/?view=cm&fs=1&to=" + e(MAIL) + "&su=" + e(subject) + "&body=" + e(body);
    if (gm.length > 7000) gm = "https://mail.google.com/mail/?view=cm&fs=1&to=" + e(MAIL) + "&su=" + e(subject) + "&body=" + e(shortBody);
    var mt = "mailto:" + MAIL + "?subject=" + e(subject) + "&body=" + e(body);
    if (mt.length > 1900) mt = "mailto:" + MAIL + "?subject=" + e(subject) + "&body=" + e(shortBody);
    return { full: full, wa: wa, gm: gm, mt: mt };
  }

  function summaryHTML() {
    var L = links();
    var n = totalAnswered();
    var h = '<div class="wrap"><section class="sec reveal" style="padding-bottom:28px"><header class="sec__head">' +
      '<p class="eyebrow">podsumowanie</p>' +
      '<h1 class="sec__title" id="view-title" tabindex="-1">sprawdź i wyślij</h1>' +
      '<p class="sec__lead">' + n + " " + plural(n, "odpowiedź", "odpowiedzi", "odpowiedzi") + ". Jeśli chcesz coś zmienić, kliknij nazwę części poniżej.</p>" +
      "</header></section></div>";

    h += '<section class="band" aria-labelledby="send-title"><div class="wrap band__in send">' +
      '<h2 id="send-title">wyślij odpowiedzi</h2>' +
      "<p>Każdy przycisk najpierw kopiuje odpowiedzi, a potem otwiera wiadomość. Jeśli tekst nie pojawi się w niej sam, wklej go (Ctrl+V albo przytrzymaj palec i wybierz Wklej) i wyślij.</p>" +
      '<div class="send__btns">' +
      '<button type="button" class="btn btn--primary" data-copy>kopiuj odpowiedzi</button>' +
      '<a class="btn btn--ghost" data-send href="' + esc(L.wa) + '" target="_blank" rel="noopener">WhatsApp</a>' +
      '<a class="btn btn--ghost" data-send href="' + esc(L.gm) + '" target="_blank" rel="noopener">Gmail</a>' +
      '<a class="btn btn--ghost" data-send href="' + esc(L.mt) + '" target="_blank" rel="noopener">inny program pocztowy</a>' +
      "</div>" +
      '<p class="status" id="status" role="status" aria-live="polite"></p>' +
      '<div class="send__info"><p>E-mail: <strong>' + MAIL + '</strong> <button type="button" class="linkbtn" data-copymail>kopiuj adres</button></p>' +
      "<p>WhatsApp: <strong>" + WA_SHOW + "</strong></p>" +
      "<p>Dołącz też, jeśli masz: rzut lub plan mieszkania, zdjęcia obecnego stanu, zdjęcia rzeczy, które zostają, i inspiracje.</p>" +
      '<p class="send__rodo">Dopóki nie wyślesz odpowiedzi, zapisują się tylko w tej przeglądarce. Wysłane wykorzystam wyłącznie do przygotowania projektu. Administratorem danych jest Karolina Gawlik, studiolina, ' + MAIL + ".</p></div>" +
      '<details class="outbox" id="outbox"><summary>pokaż tekst odpowiedzi</summary>' +
      '<textarea id="out" readonly aria-label="Tekst odpowiedzi do skopiowania">' + esc(L.full) + "</textarea></details>" +
      "</div></section>";

    h += '<div class="wrap" style="padding-top:20px">';
    S.forEach(function (s, i) {
      var it = items(s);
      h += '<div class="rev"><button type="button" class="rev__head" data-go="' + i + '"><span class="rev__num">' + pad(i + 1) + '</span><span class="rev__t">' + esc(s.t) + '</span><span class="rev__edit">zmień</span></button>';
      if (it.length) {
        h += '<dl class="rev__list">' + it.map(function (p) {
          return '<div class="rev__row"><dt>' + esc(p[0]) + "</dt><dd>" + esc(p[1]) + "</dd></div>";
        }).join("") + "</dl>";
      } else {
        h += '<p class="rev__empty">bez odpowiedzi</p>';
      }
      h += "</div>";
    });
    h += '<div class="reset" id="reset"><button type="button" class="linkbtn" data-reset>wyczyść wszystkie odpowiedzi</button></div></div>';
    return h;
  }

  /* łańcuch postępu */
  function buildChain() {
    var c = document.getElementById("chain");
    c.innerHTML = S.map(function (s, i) {
      return '<button type="button" class="chain__seg" data-go="' + i + '" style="flex-grow:' + s.main + '" aria-label="część ' + (i + 1) + ": " + esc(s.t) + '"></button>';
    }).join("");
  }
  function updateChain() {
    var segs = document.querySelectorAll(".chain__seg");
    segs.forEach(function (b, i) {
      b.classList.toggle("is-current", view === i);
      b.classList.toggle("is-done", answered(S[i]) > 0 && view !== i);
      b.setAttribute("aria-current", view === i ? "step" : "false");
    });
    var l = document.getElementById("pl-l"), r = document.getElementById("pl-r");
    if (view === "intro") l.innerHTML = "<b>start</b> &middot; " + S.length + " części";
    else if (view === "summary") l.innerHTML = "<b>podsumowanie</b>";
    else l.innerHTML = "<b>" + pad(view + 1) + "</b> &middot; " + esc(S[view].t);
    var n = totalAnswered();
    r.textContent = n + " " + plural(n, "odpowiedź", "odpowiedzi", "odpowiedzi");
  }

  function render(focus) {
    var app = document.getElementById("app");
    if (view === "intro") app.innerHTML = introHTML();
    else if (view === "summary") app.innerHTML = summaryHTML();
    else app.innerHTML = sectionHTML(view);
    updateChain();
    if (focus) {
      try { window.scrollTo(0, 0); } catch (e) {}
      var t = document.getElementById("view-title");
      if (t) t.focus({ preventScroll: true });
    }
  }

  function go(to) {
    if (to === "resume") {
      var idx = 0;
      S.forEach(function (s, i) { if (answered(s)) idx = i; });
      to = idx;
    }
    if (to === "intro" || to === "summary") view = to;
    else {
      var n = parseInt(to, 10);
      if (!isNaN(n) && n >= 0 && n < S.length) view = n;
    }
    save(true);
    render(true);
  }

  function refreshConditions() {
    document.querySelectorAll("[data-qb]").forEach(function (el) {
      var q = QM[el.getAttribute("data-qb")];
      el.hidden = !visible(q);
    });
    updateChain();
  }

  /* kopiowanie */
  function fallbackCopy() {
    var box = document.getElementById("outbox");
    var ta = document.getElementById("out");
    if (!ta) return false;
    if (box) box.open = true;
    ta.focus();
    ta.select();
    try { return document.execCommand("copy"); } catch (e) { return false; }
  }
  function copyText(text, onDone) {
    var done = function (ok) { if (onDone) onDone(ok); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy()); });
        return;
      }
    } catch (e) {}
    done(fallbackCopy());
  }
  function status(msg) {
    var s = document.getElementById("status");
    if (s) s.textContent = msg;
  }

  /* zdarzenia */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button, a");
    if (!t) return;

    if (t.hasAttribute("data-go")) { go(t.getAttribute("data-go")); return; }

    if (t.hasAttribute("data-opt")) {
      var q = QM[t.getAttribute("data-opt")];
      var o = optsOf(q)[+t.getAttribute("data-i")];
      if (q.type === "single") {
        if (A[q.id] === o) delete A[q.id]; else A[q.id] = o;
      } else {
        var a = arr(A[q.id]).slice();
        var excl = q.excl || [];
        if (a.indexOf(o) > -1) a = a.filter(function (x) { return x !== o; });
        else if (excl.indexOf(o) > -1) a = [o];
        else { a = a.filter(function (x) { return excl.indexOf(x) < 0; }); a.push(o); }
        if (a.length) A[q.id] = a; else delete A[q.id];
      }
      var sel = arr(A[q.id]);
      var block = t.closest(".q__body");
      block.querySelectorAll("[data-opt]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(sel.indexOf(optsOf(q)[+b.getAttribute("data-i")]) > -1));
      });
      var other = block.querySelector("[data-other]");
      if (other) {
        var showO = sel.indexOf(otherOf(q)) > -1;
        var wasHidden = other.hidden;
        other.hidden = !showO;
        if (showO && wasHidden) other.focus();
      }
      save(); refreshConditions(); return;
    }

    if (t.hasAttribute("data-pic")) {
      var qp = QM[t.getAttribute("data-pic")];
      var pn = +t.getAttribute("data-n");
      var cp = arr(A[qp.id]).slice();
      if (cp.indexOf(pn) > -1) cp = cp.filter(function (x) { return x !== pn; }); else cp.push(pn);
      cp.sort(function (a, b) { return a - b; });
      if (cp.length) A[qp.id] = cp; else delete A[qp.id];
      t.setAttribute("aria-pressed", String(cp.indexOf(pn) > -1));
      save(); updateChain(); return;
    }

    if (t.hasAttribute("data-scale")) {
      var qid = t.getAttribute("data-scale");
      var n = +t.getAttribute("data-n");
      if (A[qid] === n) delete A[qid]; else A[qid] = n;
      var wrap = t.closest(".scale");
      wrap.querySelectorAll("[data-scale]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(A[qid] === +b.getAttribute("data-n")));
      });
      wrap.querySelectorAll(".scale__ticks span").forEach(function (sp, i) {
        sp.classList.toggle("is-on", A[qid] === i + 1);
      });
      save(); updateChain(); return;
    }

    if (t.hasAttribute("data-step")) {
      var qq = QM[t.getAttribute("data-step")];
      var d = +t.getAttribute("data-d");
      var val = has(qq.id) ? +A[qq.id] : null;
      if (val == null) { if (d > 0) val = qq.min; }
      else {
        val += d;
        if (val < qq.min) val = null;
        if (val > qq.max) val = qq.max;
      }
      if (val == null) delete A[qq.id]; else A[qq.id] = val;
      var out = document.getElementById("q-" + qq.id);
      out.textContent = val == null ? "·" : String(val);
      out.classList.toggle("is-empty", val == null);
      save(); updateChain(); return;
    }

    if (t.hasAttribute("data-copy")) {
      copyText(buildText(), function (ok) {
        status(ok ? "Skopiowane. Wklej odpowiedzi w wiadomość do mnie i wyślij." :
          "Nie udało się skopiować automatycznie. Tekst jest zaznaczony poniżej, skopiuj go ręcznie.");
      });
      return;
    }

    if (t.hasAttribute("data-send")) {
      copyText(buildText(), function (ok) {
        status(ok ? "Odpowiedzi są skopiowane. Jeśli wiadomość się nie otworzyła albo jest pusta, wklej je ręcznie i wyślij na " + MAIL + "." :
          "Jeśli wiadomość się nie otworzyła, skopiuj tekst poniżej i wyślij go na " + MAIL + ".");
      });
      return;
    }

    if (t.hasAttribute("data-copymail")) {
      copyText(MAIL, function (ok) { status(ok ? "Adres skopiowany." : "Zaznacz adres i skopiuj go ręcznie."); });
      return;
    }

    if (t.hasAttribute("data-reset")) {
      var r = document.getElementById("reset");
      r.innerHTML = "<span>Na pewno? Odpowiedzi znikną z tego urządzenia.</span>" +
        '<button type="button" class="btn btn--ghost" data-reset-yes>tak, wyczyść</button>' +
        '<button type="button" class="linkbtn" data-reset-no>anuluj</button>';
      return;
    }
    if (t.hasAttribute("data-reset-yes")) {
      A = {};
      view = "intro";
      save(true);
      render(true);
      return;
    }
    if (t.hasAttribute("data-reset-no")) {
      document.getElementById("reset").innerHTML = '<button type="button" class="linkbtn" data-reset>wyczyść wszystkie odpowiedzi</button>';
      return;
    }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.hasAttribute("data-text")) {
      var id = t.getAttribute("data-text");
      if (t.value.trim() === "") delete A[id]; else A[id] = t.value;
      save(); updateChain(); return;
    }
    if (t.hasAttribute("data-other")) {
      var oid = t.getAttribute("data-other");
      A[oid + "__o"] = t.value;
      save(); return;
    }
  });

  /* start */
  function boot(data) {
    storageOK = testStorage();
    if (data && data.A) { A = data.A; view = data.view; }
    else load();
    if (!(view === "intro" || view === "summary" || (typeof view === "number" && view >= 0 && view < S.length))) view = "intro";
    buildChain();
    render(false);
  }
  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(function () { return { A: A, view: view }; });
    }
  } catch (e) {}
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

</body>
</html>
